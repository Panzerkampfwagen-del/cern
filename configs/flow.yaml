name: flow
out: results/flow

model:
  input_dim: 8
  n_layers: 8
  hidden: [128, 128]
  seed: 0

data:
  features: results/features.npz
  seed: 0
  # Log-transform the heavy-tailed mass/pT columns so the flow models a
  # near-Gaussian target. Indices: m_j1, m_j2, pT_j1, pT_j2, m_jj.
  log_features: [0, 1, 2, 3, 6]
  splits:
    val_bg: 80000
    val_sig: 20000
    test_bg: 200000
    test_sig: 10000

train:
  lr: 0.0005
  epochs: 200
  batch: 512
  weight_decay: 1.0e-5
  grad_clip: 1.0
  cosine: false
  log_every: 10
  patience: 30
  early_stop_metric: auc
  val_subsample: 40000
