name: autoencoder
out: results/autoencoder

model:
  input_dim: 8
  hidden: [64, 32, 16]
  latent_dim: 4

data:
  features: results/features.npz
  seed: 0
  log_features: []          # spec: AE uses plain zero-mean/unit-variance
  splits:
    val_bg: 80000
    val_sig: 20000
    test_bg: 200000
    test_sig: 10000

train:
  lr: 0.001
  epochs: 100
  batch: 512
  weight_decay: 1.0e-5
  cosine: false
  grad_clip: null
  log_every: 10
  patience: 25
  early_stop_metric: separation
  val_subsample: 40000
